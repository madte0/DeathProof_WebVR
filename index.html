<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Proof Project</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./css/modalstyles.css">

</head>
<body>
    <a-scene>
        <!-- Assets Management System -->
        <a-assets>
            <a-assets-item id="dp-scene" src="./assets/chevy_nova_scene_webpTextures_glb/chevy_nova_scene_external_textures.gltf?v=20260608"></a-assets-item>
            <!-- modal images -->
            <img
                id="photo1"
                src="./assets/chevy_nova_scene_webpTextures_glb/photo1.webp">

            <img
                id="photo2"
                src="./assets/chevy_nova_scene_webpTextures_glb/photo2.webp">
        </a-assets>

        <!-- Death Proof Scene -->
            <a-entity gltf-model="#dp-scene" scroll-animation-scrub></a-entity>

        <!-- Camera Rig / Wrapper -->
        <!-- The Camera -->
            <a-camera wasd-controls="enabled: false" look-controls></a-camera>

        <!-- modal windows -->
            <a-plane
                id="zone1"
                position="-0.3 1.3 -2"
                width="0.4"
                height="0.2"
                opacity="0">
            </a-plane>

            <a-plane
                id="zone2"
                position="0 1.3 -2"
                width="0.4"
                height="0.2"
                opacity="0">
            </a-plane>

            <a-plane
                id="zone3"
                position="0.3 1.3 -2"
                width="0.4"
                height="0.2"
                opacity="0">
            </a-plane>

    </a-scene>

    <!-- Deft Proof / MODALS -->
    <div id="modal" class="modal">

        <div class="modal-content">
    
            <span id="closeModal">&times;</span>
    
            <img id="modalImage" style="display:none;">
    
            <iframe
                id="youtubeFrame"
                style="display:none;"
                width="900"
                height="500"
                allowfullscreen>
            </iframe>
    
        </div>
    
    </div>
</body>
</html>
