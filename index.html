<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Proof Project</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="./script.js" defer></script>

    <link rel="stylesheet" href="./css/modalstyles.css">
</head>

<body>

    <a-scene>

        <a-assets>

            <a-assets-item
                id="dp-scene"
                src="./assets/chevy_nova_scene_webpTextures_glb/chevy_nova_scene_external_textures.gltf?v=20260608">
            </a-assets-item>

            <img
                id="photo1"
                src="./assets/chevy_nova_scene_webpTextures_glb/photo1.webp">

            <img
                id="photo2"
                src="./assets/chevy_nova_scene_webpTextures_glb/photo2.webp">

        </a-assets>

        <a-entity
            id="deathProofModel"
            gltf-model="#dp-scene"
            scroll-animation-scrub>
        </a-entity>

        <a-camera
            wasd-controls="enabled:false">

            <a-cursor
                color="white"
                rayOrigin="mouse">
            </a-cursor>

        </a-camera>

    </a-scene>

    <div id="modal" class="modal">

        <div class="modal-content">

            <span id="closeModal">&times;</span>

            <img
                id="modalImage"
                style="display:none;">

            <iframe
                id="youtubeFrame"
                width="900"
                height="500"
                style="display:none;"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</body>
</html>
